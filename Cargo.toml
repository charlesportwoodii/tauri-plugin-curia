[package]
name = "tauri-plugin-curia"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "BSD-3-Clause"
description = "Structured logging for Tauri, over the logger crate"
links = "tauri-plugin-curia"
autotests = false

[dependencies]
curia = { git = "https://github.com/charlesportwoodii/curia", tag = "0.1.0" }
tauri = { version = "^2" }
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1" }
chrono = { version = "^0.4" }
thiserror = { version = "^2" }
time = { version = "^0.3", features = ["formatting", "local-offset", "macros"] }
flume = "0.12.0"

[target."cfg(target_os = \"android\")".dependencies]
android_logger = { version = "^0.15" }
log = { version = "^0.4" }

[target."cfg(target_os = \"ios\")".dependencies]
oslog = { version = "0.2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "^2", features = ["build"] }

[[test]]
name = "lib"
path = "tests/lib.rs"
