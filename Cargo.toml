[package]
name = "tauri-plugin-curia"
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
license = "BSD-3-Clause"
description = "Structured logging for Tauri, over the logger crate"
links = "tauri-plugin-curia"
autotests = false

[dependencies]
curia = { version = "^0.2.1" }
tauri = { version = "^2" }
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1" }
chrono = { version = "^0.4" }
thiserror = { version = "^2" }

[build-dependencies]
tauri-plugin = { version = "^2", features = ["build"] }

[[test]]
name = "lib"
path = "tests/lib.rs"
